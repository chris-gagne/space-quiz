<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Space Exploration Quiz</title>
<style>
  :root {
    --bg: #f3f5fb;
    --bg-accent: #dde4ff;
    --card: #ffffff;
    --text: #1a1d2e;
    --muted: #4f566b;
    --primary: #4b3fd6;
    --primary-text: #ffffff;
    --option-bg: #f0f2fa;
    --option-border: #c5cae0;
    --correct: #137a3a;
    --correct-bg: #d6f5e0;
    --wrong: #b3261e;
    --wrong-bg: #fde0de;
    --focus: #ff9f1c;
    --track: #e1e4f0;
    --shadow: 0 10px 30px rgba(30, 35, 80, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d1c;
      --bg-accent: #1c1a45;
      --card: #161a33;
      --text: #eef0ff;
      --muted: #aab0d0;
      --primary: #8c82ff;
      --primary-text: #0b0d1c;
      --option-bg: #1f2446;
      --option-border: #343b6b;
      --correct: #5ee08f;
      --correct-bg: #14402a;
      --wrong: #ff7b72;
      --wrong-bg: #4a1a1a;
      --focus: #ffc857;
      --track: #262b52;
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 10%, var(--bg-accent), var(--bg) 60%) fixed;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1rem; line-height: 1.5;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
  .stars span {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--muted); opacity: .5; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 50% { opacity: .1; } }

  main {
    width: 100%; max-width: 640px; background: var(--card);
    border-radius: 20px; box-shadow: var(--shadow); padding: 2rem;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
  h2 { font-size: 1.3rem; margin: 1rem 0; }
  p { color: var(--muted); }
  [hidden] { display: none !important; }

  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--primary); color: var(--primary-text);
    border: none; border-radius: 12px; padding: .8rem 1.6rem;
    transition: transform .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .topbar { display: flex; justify-content: space-between; font-weight: 600; color: var(--muted); font-size: .95rem; }
  .progress { height: 12px; background: var(--track); border-radius: 999px; overflow: hidden; margin: .5rem 0 1rem; }
  .progress-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #6a5cff, #00c2ff, #5ee08f);
    border-radius: inherit; transition: width .5s ease;
  }
  .score-pop { display: inline-block; }
  .score-pop.bump { animation: bump .4s ease; }
  @keyframes bump { 50% { transform: scale(1.4); color: var(--correct); } }

  .options { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
  .option {
    width: 100%; text-align: left; font: inherit; color: var(--text);
    background: var(--option-bg); border: 2px solid var(--option-border);
    border-radius: 12px; padding: .9rem 1rem; cursor: pointer;
    display: flex; align-items: center; gap: .75rem;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .option:hover:not(:disabled) { border-color: var(--primary); transform: translateX(4px); }
  .option:disabled { cursor: default; }
  .option .key {
    flex: none; width: 1.8rem; height: 1.8rem; border-radius: 8px;
    display: grid; place-items: center; font-weight: 700; font-size: .9rem;
    background: var(--card); border: 1px solid var(--option-border);
  }
  .option .mark { margin-left: auto; font-weight: 700; }
  .option.correct {
    background: var(--correct-bg); border-color: var(--correct); color: var(--text);
    animation: glow .6s ease;
  }
  .option.wrong {
    background: var(--wrong-bg); border-color: var(--wrong);
    animation: shake .5s ease;
  }
  .option.correct .mark { color: var(--correct); }
  .option.wrong .mark { color: var(--wrong); }
  .option.dim { opacity: .55; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  @keyframes glow {
    0% { transform: scale(1); box-shadow: 0 0 0 0 var(--correct); }
    50% { transform: scale(1.03); box-shadow: 0 0 0 8px transparent; }
    100% { transform: scale(1); }
  }

  .feedback {
    margin-top: 1rem; padding: .8rem 1rem; border-radius: 12px; font-weight: 600;
    animation: fadeIn .35s ease;
  }
  .feedback.good { background: var(--correct-bg); color: var(--correct); }
  .feedback.bad { background: var(--wrong-bg); color: var(--wrong); }
  .feedback small { display: block; font-weight: 400; color: var(--text); margin-top: .25rem; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

  .actions { margin-top: 1.25rem; display: flex; justify-content: flex-end; }
  .hint { font-size: .85rem; margin-top: 1rem; }
  kbd {
    font-family: inherit; font-size: .8rem; padding: .05rem .4rem;
    border: 1px solid var(--option-border); border-radius: 4px; background: var(--option-bg);
  }

  #results { text-align: center; }
  .emoji { font-size: 8rem; line-height: 1.1; display: inline-block; animation: pop .8s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-30deg); } }
  .big-score { font-size: 2.2rem; font-weight: 800; margin: .25rem 0; color: var(--text); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<main>
  <section id="start" aria-labelledby="start-title">
    <h1 id="start-title">🚀 Space Exploration Quiz</h1>
    <p>Test your knowledge of the cosmos with 10 questions about planets, missions, and the people who reached for the stars.</p>
    <p class="hint">Keyboard: <kbd>Tab</kbd> to move, <kbd>Enter</kbd>/<kbd>Space</kbd> to choose, or press <kbd>1</kbd>–<kbd>4</kbd> to answer and <kbd>Enter</kbd> to continue.</p>
    <div class="actions"><button class="btn" id="start-btn" type="button">Start quiz</button></div>
  </section>

  <section id="quiz" hidden aria-labelledby="question-text">
    <div class="topbar">
      <span id="counter">Question 1 of 10</span>
      <span>Score: <span class="score-pop" id="score">0</span></span>
    </div>
    <div class="progress" role="progressbar" aria-label="Quiz progress"
         aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <h2 id="question-text" tabindex="-1"></h2>
    <ul class="options" id="options" role="list"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="btn" id="next-btn" type="button" hidden>Next question</button></div>
  </section>

  <section id="results" hidden aria-labelledby="results-title">
    <div class="emoji" id="result-emoji" role="img" aria-label=""></div>
    <h1 id="results-title" tabindex="-1">Mission complete!</h1>
    <p class="big-score" id="result-score"></p>
    <p id="result-msg"></p>
    <div class="actions" style="justify-content:center"><button class="btn" id="restart-btn" type="button">Play again</button></div>
  </section>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main>

<script>
(() => {
  const QUESTIONS = [
    { q: "Who was the first human to travel into space?",
      a: ["Neil Armstrong", "Yuri Gagarin", "Alan Shepard", "John Glenn"], c: 1,
      f: "Yuri Gagarin orbited Earth aboard Vostok 1 on April 12, 1961." },
    { q: "Which planet is known as the Red Planet?",
      a: ["Venus", "Jupiter", "Mars", "Mercury"], c: 2,
      f: "Iron oxide (rust) in its soil gives Mars its reddish color." },
    { q: "What was the name of the first artificial satellite launched into orbit?",
      a: ["Explorer 1", "Sputnik 1", "Vanguard 1", "Telstar"], c: 1,
      f: "The Soviet Union launched Sputnik 1 on October 4, 1957." },
    { q: "Which Apollo mission first landed humans on the Moon?",
      a: ["Apollo 8", "Apollo 11", "Apollo 13", "Apollo 17"], c: 1,
      f: "Apollo 11 landed on July 20, 1969, with Neil Armstrong and Buzz Aldrin." },
    { q: "What is the largest planet in our Solar System?",
      a: ["Saturn", "Neptune", "Earth", "Jupiter"], c: 3,
      f: "Jupiter is more than twice as massive as all other planets combined." },
    { q: "Which space telescope launched in 2021 observes mainly in infrared?",
      a: ["Hubble", "Kepler", "James Webb", "Spitzer"], c: 2,
      f: "The James Webb Space Telescope launched on December 25, 2021." },
    { q: "Which spacecraft is the most distant human-made object from Earth?",
      a: ["Voyager 1", "Pioneer 10", "New Horizons", "Voyager 2"], c: 0,
      f: "Voyager 1 entered interstellar space in 2012." },
    { q: "Who was the first woman to travel into space?",
      a: ["Sally Ride", "Valentina Tereshkova", "Mae Jemison", "Eileen Collins"], c: 1,
      f: "Valentina Tereshkova flew aboard Vostok 6 in June 1963." },
    { q: "What is the name of NASA's rover that landed in Jezero Crater in 2021?",
      a: ["Curiosity", "Opportunity", "Spirit", "Perseverance"], c: 3,
      f: "Perseverance also carried Ingenuity, the first helicopter to fly on another planet." },
    { q: "Roughly how long does sunlight take to reach Earth?",
      a: ["8 seconds", "8 minutes", "8 hours", "8 days"], c: 1,
      f: "Light travels about 150 million km from the Sun in roughly 8 minutes 20 seconds." }
  ];

  const $ = id => document.getElementById(id);
  const screens = { start: $("start"), quiz: $("quiz"), results: $("results") };
  const optionsEl = $("options"), feedbackEl = $("feedback"), nextBtn = $("next-btn");
  const scoreEl = $("score"), live = $("live");
  let index = 0, score = 0, answered = false;

  // Decorative starfield
  const stars = document.querySelector(".stars");
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("span");
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    stars.appendChild(s);
  }

  function show(name) {
    Object.entries(screens).forEach(([k, el]) => el.hidden = k !== name);
  }

  function updateProgress(done) {
    $("progress-fill").style.width = (done / QUESTIONS.length * 100) + "%";
    const p = $("progress");
    p.setAttribute("aria-valuenow", done);
    p.setAttribute("aria-valuetext", `${done} of ${QUESTIONS.length} questions answered`);
  }

  function start() {
    index = 0; score = 0;
    scoreEl.textContent = "0";
    show("quiz");
    renderQuestion();
  }

  function renderQuestion() {
    const item = QUESTIONS[index];
    answered = false;
    $("counter").textContent = `Question ${index + 1} of ${QUESTIONS.length}`;
    updateProgress(index);
    const qText = $("question-text");
    qText.textContent = item.q;
    feedbackEl.hidden = true;
    nextBtn.hidden = true;
    optionsEl.innerHTML = "";
    item.a.forEach((text, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.dataset.index = i;
      btn.innerHTML = `<span class="key" aria-hidden="true">${i + 1}</span><span class="label"></span><span class="mark" aria-hidden="true"></span>`;
      btn.querySelector(".label").textContent = text;
      btn.addEventListener("click", () => choose(i));
      li.appendChild(btn);
      optionsEl.appendChild(li);
    });
    qText.focus();
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    const item = QUESTIONS[index];
    const buttons = [...optionsEl.querySelectorAll(".option")];
    const correct = i === item.c;
    buttons.forEach((b, j) => {
      b.disabled = true;
      if (j === item.c) {
        b.classList.add("correct");
        b.querySelector(".mark").textContent = "✓";
        b.setAttribute("aria-label", `${item.a[j]} — correct answer`);
      } else if (j === i) {
        b.classList.add("wrong");
        b.querySelector(".mark").textContent = "✗";
        b.setAttribute("aria-label", `${item.a[j]} — your answer, incorrect`);
      } else {
        b.classList.add("dim");
      }
    });

    if (correct) {
      score++;
      scoreEl.textContent = score;
      scoreEl.classList.remove("bump");
      void scoreEl.offsetWidth;
      scoreEl.classList.add("bump");
    }
    updateProgress(index + 1);

    feedbackEl.className = "feedback " + (correct ? "good" : "bad");
    const heading = correct ? "✅ Correct!" : `❌ Not quite — the answer is ${item.a[item.c]}.`;
    feedbackEl.innerHTML = "";
    feedbackEl.append(heading);
    const small = document.createElement("small");
    small.textContent = item.f;
    feedbackEl.appendChild(small);
    feedbackEl.hidden = false;
    live.textContent = `${correct ? "Correct!" : "Incorrect. The answer is " + item.a[item.c] + "."} ${item.f} Score: ${score} of ${QUESTIONS.length}.`;

    nextBtn.textContent = index === QUESTIONS.length - 1 ? "See results" : "Next question";
    nextBtn.hidden = false;
    nextBtn.focus();
  }

  function next() {
    index++;
    if (index < QUESTIONS.length) renderQuestion();
    else showResults();
  }

  let countFrame = 0;
  function countUp(el, target, total) {
    cancelAnimationFrame(countFrame);
    if (target === 0 || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      el.textContent = `${target} / ${total}`;
      return;
    }
    const duration = 400 + target * 120;
    const t0 = performance.now();
    const step = now => {
      const p = Math.min((now - t0) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = `${Math.round(eased * target)} / ${total}`;
      if (p < 1) countFrame = requestAnimationFrame(step);
    };
    el.textContent = `0 / ${total}`;
    countFrame = requestAnimationFrame(step);
  }

  function showResults() {
    const pct = score / QUESTIONS.length;
    let emoji, label, msg;
    if (pct === 1)      { emoji = "🤩"; label = "Star-struck face"; msg = "Perfect score! You're ready for mission control."; }
    else if (pct >= .8) { emoji = "🚀"; label = "Rocket";           msg = "Stellar work, astronaut!"; }
    else if (pct >= .5) { emoji = "🙂"; label = "Smiling face";     msg = "Solid orbit! A little more study and you'll reach the stars."; }
    else if (pct >= .3) { emoji = "🤔"; label = "Thinking face";    msg = "Houston, we have a learning opportunity."; }
    else                { emoji = "😵"; label = "Dizzy face";       msg = "Lost in space! Give it another launch."; }
    const e = $("result-emoji");
    e.textContent = emoji;
    e.setAttribute("aria-label", label);
    e.style.animation = "none"; void e.offsetWidth; e.style.animation = "";
    countUp($("result-score"), score, QUESTIONS.length);
    $("result-msg").textContent = msg;
    show("results");
    $("results-title").focus();
    live.textContent = `Quiz complete. You scored ${score} out of ${QUESTIONS.length}. ${msg}`;
  }

  $("start-btn").addEventListener("click", start);
  $("restart-btn").addEventListener("click", start);
  nextBtn.addEventListener("click", next);

  document.addEventListener("keydown", e => {
    if (screens.quiz.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    if (!answered && n >= 1 && n <= QUESTIONS[index].a.length) {
      e.preventDefault();
      choose(n - 1);
    } else if (answered && e.key === "Enter" && document.activeElement !== nextBtn) {
      e.preventDefault();
      next();
    }
  });
})();
</script>
</body>
</html>
